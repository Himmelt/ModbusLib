name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore ModbusLib.slnx
      - name: Build
        run: dotnet build ModbusLib.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ModbusLib.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack ModbusLib/ModbusLib.csproj -c Release -o artifacts
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # 启用 GitHub OIDC：NuGet 可信发布用它换短期 API key，无需长期 secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Pack
        run: dotnet pack ModbusLib/ModbusLib.csproj -c Release -o out
      # NuGet 可信发布（Trusted Publishing）：用 OIDC 换一个几分钟后就过期的临时 API key。
      # user 是 nuget.org 的「配置文件名称」（https://www.nuget.org/profiles/Himmelt），不是邮箱。
      # 常量写死；若日后账号改名，改这一行即可。
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Himmelt
      - name: Push to NuGet.org
        run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --symbol-source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
